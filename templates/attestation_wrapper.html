<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Attestation of OSINT Assessment - {{ case.case_ref }}</title>
    <style>
        @page {
            size: A4;
            margin: 25mm 20mm 20mm 20mm;
            @bottom-center {
                content: "OFFICIAL ATTESTATION DOCUMENT — {{ firm.name }}";
                font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
                font-size: 8pt;
                color: #a0aec0;
            }
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-size: 10.5pt;
            line-height: 1.6;
            color: #2d3748;
        }

        h1 {
            font-size: 20pt;
            color: #1a202c;
            margin-bottom: 5px;
            letter-spacing: 0.5px;
        }

        h3 {
            font-size: 12pt;
            color: #2b6cb0;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 4px;
            margin-top: 20px;
        }

        blockquote {
            background: #f7fafc;
            border-left: 4px solid #2b6cb0;
            margin: 15px 0;
            padding: 10px 15px;
            color: #2d3748;
        }

        hr {
            border: 0;
            height: 1px;
            background: #cbd5e0;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    {{ content | safe }}
</body>
</html>
