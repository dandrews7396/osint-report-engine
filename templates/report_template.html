<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ case.case_name }} - OSINT Intelligence Report</title>
    <style>
        @page {
            size: A4;
            margin: 20mm 15mm 20mm 15mm;
            @bottom-left {
                content: "CONFIDENTIAL | {{ firm.name }}";
                font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
                font-size: 8pt;
                color: #718096;
            }
            @bottom-right {
                content: "Page " counter(page) " of " counter(pages);
                font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
                font-size: 8pt;
                color: #718096;
            }
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-size: 10pt;
            line-height: 1.6;
            color: #2d3748;
        }

        h1 {
            font-size: 24pt;
            color: #1a202c;
            border-bottom: 3px solid #2b6cb0;
            padding-bottom: 10px;
            margin-top: 0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        h2 {
            font-size: 15pt;
            color: #2b6cb0;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 6px;
            margin-top: 25px;
        }

        h3 {
            font-size: 12pt;
            color: #2d3748;
            margin-top: 20px;
        }

        a {
            color: #3182ce;
            text-decoration: none;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 15px 0;
            font-size: 9.5pt;
        }

        th, td {
            padding: 8px 12px;
            border: 1px solid #cbd5e0;
            text-align: left;
        }

        th {
            background-color: #2d3748;
            color: #ffffff;
            font-weight: bold;
        }

        .tools-table th {
            background-color: #2b6cb0;
        }

        .risk-badge {
            display: inline-block;
            padding: 4px 10px;
            font-weight: bold;
            font-size: 8.5pt;
            color: #ffffff;
            border-radius: 3px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .risk-badge.Critical { background-color: #9b2c2c; }
        .risk-badge.High { background-color: #c53030; }
        .risk-badge.Medium { background-color: #dd6b20; }
        .risk-badge.Low { background-color: #38a169; }
        .risk-badge.Informational { background-color: #3182ce; }

        blockquote {
            background: #f7fafc;
            border-left: 4px solid #3182ce;
            margin: 15px 0;
            padding: 10px 15px;
            font-style: italic;
            color: #4a5568;
        }

        code, pre {
            font-family: 'Courier New', Courier, monospace;
            background-color: #edf2f7;
            border-radius: 3px;
        }

        pre {
            padding: 12px;
            overflow-x: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-size: 8.5pt;
            border: 1px solid #e2e8f0;
        }

        .markdown-content pre {
            background-color: #1a202c;
            color: #e2e8f0;
        }

        hr {
            border: 0;
            height: 1px;
            background: #e2e8f0;
            margin: 25px 0;
        }
    </style>
</head>
<body>
    {{ body | safe }}
</body>
</html>
