<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ case.case_ref }} - Intelligence Report</title>
    <style>
        @page {
            size: A4;
            margin: 18mm 16mm 18mm 16mm;
            @bottom-left {
                content: "CONFIDENTIAL INTELLIGENCE REPORT";
                font-family: "Segoe UI", Arial, sans-serif;
                font-size: 7pt;
                font-weight: 700;
                color: #64748b;
            }
            @bottom-right {
                content: "Page " counter(page) " of " counter(pages);
                font-family: "Segoe UI", Arial, sans-serif;
                font-size: 7.5pt;
                color: #64748b;
            }
        }

        :root {
            --ink: #111827;
            --muted: #475569;
            --panel: #f8fafc;
            --line: #dfe7f1;
            --navy: #0f172a;
            --slate: #334155;
            --accent: #b08a44;
            --accent-soft: #f3ead4;
            --blue: #1d4ed8;
            --red: #b91c1c;
            --amber: #b45309;
            --green: #166534;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            font-size: 10pt;
            line-height: 1.55;
            color: var(--ink);
            background: #ffffff;
        }

        .header-container {
            text-align: center;
            border-bottom: 2px solid var(--navy);
            padding-bottom: 12px;
            margin-bottom: 22px;
        }

        .agency-title {
            font-size: 10.5pt;
            font-weight: 700;
            letter-spacing: 1.2px;
            color: var(--muted);
            text-transform: uppercase;
        }

        .report-title {
            font-size: 22pt;
            font-weight: 800;
            color: var(--navy);
            margin-top: 6px;
            letter-spacing: 0.3px;
        }

        .report-subtitle {
            font-size: 9.5pt;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: var(--accent);
            text-transform: uppercase;
        }

        .report-shell {
            margin-top: 10px;
            margin-bottom: 14px;
        }

        .edd-cover-grid {
            width: 100%;
            border-collapse: collapse;
            margin: 14px 0 18px 0;
            font-size: 8.5pt;
        }

        .edd-cover-grid td {
            padding: 6px 8px;
            border: 1px solid var(--line);
            vertical-align: top;
        }

        .edd-cover-grid .label {
            background: var(--panel);
            width: 18%;
            font-weight: 700;
            color: var(--slate);
        }

        .edd-cover-grid .value {
            width: 32%;
            background: #ffffff;
        }

        .highlight-red {
            color: var(--red);
            font-weight: 700;
        }

        h1, h2, h3, h4 {
            color: var(--navy);
            margin-top: 18px;
            margin-bottom: 8px;
            page-break-after: avoid;
        }

        h2 {
            font-size: 12.5pt;
            font-weight: 800;
            border-bottom: 1.5px solid var(--accent);
            padding-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.25px;
        }

        h3 {
            font-size: 10.8pt;
            font-weight: 700;
            color: var(--slate);
        }

        h4 {
            font-size: 9.8pt;
            font-weight: 700;
            color: var(--slate);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 12px 0 16px 0;
            font-size: 8.5pt;
        }

        th, td {
            padding: 7px 9px;
            border: 1px solid var(--line);
            text-align: left;
            vertical-align: top;
        }

        th {
            background: var(--navy);
            color: #ffffff;
            font-weight: 700;
        }

        .edd-keyvalue-table td.kv-label {
            width: 30%;
            background: var(--panel);
            font-weight: 700;
            color: var(--slate);
        }

        .risk-summary-box,
        .executive-assessment-block,
        .callout-warning,
        .callout-note,
        .hash-box {
            border-left: 4px solid var(--accent);
            padding: 10px 12px;
            margin: 10px 0 14px 0;
            background: var(--panel);
        }

        .risk-summary-box.high-risk {
            border-left-color: var(--red);
            background: #fef2f2;
        }

        .risk-summary-box.medium-risk,
        .risk-summary-box.adverse-findings {
            border-left-color: var(--amber);
            background: #fff7ed;
        }

        .risk-summary-box.low-risk {
            border-left-color: var(--green);
            background: #f0fdf4;
        }

        .callout-warning {
            border-left-color: var(--amber);
            background: #fff7ed;
        }

        .callout-note {
            border-left-color: var(--blue);
            background: #eff6ff;
        }

        .hash-box {
            background: #f8fafc;
            border-left-color: var(--navy);
            font-size: 8pt;
            word-break: break-all;
        }

        .badge {
            display: inline-block;
            padding: 2px 7px;
            font-size: 7.5pt;
            font-weight: 700;
            color: #fff;
            border-radius: 3px;
        }

        .badge-high { background-color: var(--green); }
        .badge-med { background-color: var(--amber); }
        .badge-low { background-color: var(--red); }

        .risk-badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 999px;
            font-size: 8pt;
            font-weight: 700;
            color: white;
        }

        .risk-badge.Critical { background: var(--red); }
        .risk-badge.High { background: #dc2626; }
        .risk-badge.Medium { background: var(--amber); }
        .risk-badge.Low { background: var(--green); }
        .risk-badge.Informational { background: #2563eb; }

        .subject-panel {
            background: #f8fafc;
            border: 1px solid var(--line);
            padding: 10px 12px;
            margin: 10px 0 12px 0;
        }

        .case-context-block {
            border: 1px solid var(--line);
            border-left: 4px solid var(--navy);
            background: linear-gradient(180deg, #fbfdff 0%, #f8fafc 100%);
            margin: 10px 0 16px 0;
        }

        .case-context-header {
            padding: 8px 12px;
            background: var(--navy);
            color: #ffffff;
            font-size: 8pt;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }

        .case-context-row {
            padding: 10px 12px;
            border-top: 1px solid var(--line);
        }

        .case-context-label {
            display: block;
            margin-bottom: 4px;
            font-size: 8pt;
            font-weight: 700;
            color: var(--slate);
            text-transform: uppercase;
            letter-spacing: 0.35px;
        }

        .case-context-value {
            color: var(--ink);
        }

        .signoff-table {
            border: none;
            margin-top: 30px;
        }

        .signoff-table td {
            border: none;
            padding: 0;
            vertical-align: top;
        }

        hr {
            border: 0;
            height: 1px;
            background: var(--line);
            margin: 18px 0;
        }

        img {
            display: block;
            max-width: min(700px, 100%);
            width: auto !important;
            height: auto !important;
            margin: 12px auto;
            page-break-inside: avoid;
        }

        img[width], img[height] {
            width: auto !important;
            height: auto !important;
        }
    </style>
</head>
<body>
    {{ body | safe }}
</body>
</html>
